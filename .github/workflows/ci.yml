name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  python-checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Syntax check (py_compile)
        run: |
          python -m compileall -q hooks/ scripts/

      - name: Install Ruff
        # pyproject.toml の [tool.ruff] を fmt/lint の Single Source of Truth として
        # CI で強制するため、SSoT 宣言だけで終わらせず実ゲートにする。
        # バージョン固定の根拠: ruff は minor bump でも lint/format 出力が変わりうる。
        # 未固定だと「昨日通ったCIが今日落ちる」という再現性崩壊が起きるため固定する。
        # 更新は意図的に pyproject.toml とセットで bump する運用。
        run: |
          python -m pip install --upgrade pip
          python -m pip install "ruff==0.15.11"

      - name: Ruff lint (pyproject.toml SSoT)
        run: |
          ruff check hooks scripts

      - name: Ruff format check (pyproject.toml SSoT)
        run: |
          ruff format --check hooks scripts

      - name: Smoke test — merge_parallel_reviews.py --help
        run: |
          python scripts/merge_parallel_reviews.py --help > /dev/null

      - name: Smoke test — review-feedback.py --help
        run: |
          python scripts/review-feedback.py --help > /dev/null

      - name: Smoke test — review-feedback.py summary (empty DB)
        run: |
          python scripts/review-feedback.py summary > /dev/null

      - name: Smoke test — hooks importable
        run: |
          python -c "import ast; [ast.parse(open(f, encoding='utf-8').read()) for f in ['hooks/enforce-go-robust-submit.py', 'hooks/enforce-go-robust-stop.py']]"

      - name: Validate SKILL.md files (existence + frontmatter)
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path

          # SKILL.md は公開配布物の中核であり、frontmatter が欠けていると Claude Code が
          # スキルとして認識できないため、CI で存在・最低限のメタデータを検証する。
          REQUIRED_SKILLS = ["ifr", "rfl", "go-robust"]
          REQUIRED_KEYS = ("description:",)
          missing = []
          invalid = []

          for name in REQUIRED_SKILLS:
              path = Path("skills") / name / "SKILL.md"
              if not path.exists():
                  missing.append(str(path))
                  continue
              text = path.read_text(encoding="utf-8")
              if not text.startswith("---"):
                  invalid.append(f"{path}: missing frontmatter opening '---'")
                  continue
              end = text.find("\n---", 3)
              if end == -1:
                  invalid.append(f"{path}: missing frontmatter closing '---'")
                  continue
              front = text[:end]
              for key in REQUIRED_KEYS:
                  if key not in front:
                      invalid.append(f"{path}: frontmatter missing '{key}'")

          if missing or invalid:
              for m in missing:
                  print(f"MISSING: {m}", file=sys.stderr)
              for i in invalid:
                  print(f"INVALID: {i}", file=sys.stderr)
              sys.exit(1)
          print(f"OK: validated {len(REQUIRED_SKILLS)} SKILL.md files")
          PY
