name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  python-checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Syntax check (py_compile)
        run: |
          python -m compileall -q hooks/ scripts/

      - name: Smoke test — merge_parallel_reviews.py --help
        run: |
          python scripts/merge_parallel_reviews.py --help > /dev/null

      - name: Smoke test — review-feedback.py --help
        run: |
          python scripts/review-feedback.py --help > /dev/null

      - name: Smoke test — review-feedback.py summary (empty DB)
        run: |
          python scripts/review-feedback.py summary > /dev/null

      - name: Smoke test — hooks importable
        run: |
          python -c "import ast; [ast.parse(open(f).read()) for f in ['hooks/enforce-go-robust-submit.py', 'hooks/enforce-go-robust-stop.py']]"
